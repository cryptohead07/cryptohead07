function displayDate(weekIndex,dayIndex,archived=false){
  const d = new Date(2026,10,(archived?10:11)+weekIndex*7+dayIndex,12,0,0);
  return d;
}
function dateKey(weekIndex,dayIndex,archived=false) {
  const d=displayDate(weekIndex,dayIndex,archived);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function roundTo5(x){return Math.round(x/5)*5;}
function specFor(item,weekIndex,archived=false) {
  const e=EXERCISES[item.id], w=weekIndex+1;
  let sets=item.sets, min=item.min, max=item.max, note='', isTest=false, specialSets=null;
  const base=[item.min,item.max];
  if(w===1&&!archived&&item.special==='pullTest'){
    note='Up to two clean singles if each leaves a rep in reserve. Use assisted singles if needed.';
  } else if(w===1&&!archived&&item.special==='pushTest'){
    note='Use standard or incline push-ups. Stop each set with 2–3 clean reps in reserve.';
  } else if(item.special==='pullTest') {
    if(w===1 || w===6) {
      sets=1; min=1; max='MAX'; isTest=true;
      specialSets=['MAX clean reps'];
      note=w===1?'Baseline: perform one strict max-form set after warm-up. If only 1 rep is possible, that is your baseline.':'Retest: one strict max-form set under similar conditions to Week 1. Stop before kipping or loss of control.';
    } else if(w===2){sets=2;min=1;max=1;note='Two clean singles. Use assistance if you cannot preserve good form.';}
    else if(w===3){sets=3;min=1;max=1;note='Three clean singles. Do not chase a second rep unless clearly comfortable.';}
    else if(w===4){sets=1;min=1;max=1;note='Deload: one EASY assisted rep, or skip if tired.';}
    else if(w===5){sets=3;min=1;max=2;note='Three sets of 1 clean strict rep; attempt a second only if 2 RIR remain.';}
  } else if(item.special==='pushTest') {
    if(w===1||w===6){sets=3;min=6;max=8;isTest=true;specialSets=['MAX clean reps','6–8 easy reps','6–8 easy reps']; note=w===1?'Baseline: do one max-form set, then use easier push-ups for 2 back-off sets.':'Retest under similar conditions to Week 1, then perform two easier back-off sets.';}
    else if(w===2){sets=3;min=7;max=11;note='Keep 2 reps in reserve; use incline if needed.';}
    else if(w===3){sets=3;min=8;max=12;note='Keep technique exact and stop with 1–2 clean reps remaining.';}
    else if(w===4){sets=2;min=6;max=8;note='Deload: easy incline push-ups are appropriate.';}
    else if(w===5){sets=3;min=6;max=10;note='Return to hard standard push-ups. Do not add weight unless every set is easy.';}
  } else if(e.mode==='hold') {
    const additions=[0,5,10,0,10,15];
    min=roundTo5(Math.max(5,base[0]+additions[weekIndex]));max=roundTo5(base[1]+additions[weekIndex]);
    if(w===4){sets=Math.max(1,Math.ceil(item.sets/2));note='Deload: shorter, easy holds only.';}
    else if(w===5){note='Increase duration only if position remains stable.';}
    else if(w===6){note='Stretch target; cut duration if form deteriorates.';}
  } else if(e.mode==='walk') {
    const inc=[0,5,5,0,5,0][weekIndex];min+=inc;max+=inc;
    if(w===4)note='Deload: keep recovery work gentle.';
  } else if(e.mode==='review') {
    min=max=1;sets=1;
  } else if(e.mode==='mobility') {
    const inc=[0,1,2,0,1,2][weekIndex];min+=inc;max+=inc;
    note='Comfortable range only. This is mobility, not a strength test.';
  } else {
    const inc=[0,1,2,0,0,1][weekIndex];min+=inc;max+=inc;
    if(w===4){sets=Math.max(1,Math.ceil(item.sets/2));note='Deload: ~3–4 reps in reserve; decrease weight or increase assistance if needed.';}
    else if(w===5){note=e.mode==='assist'?'If Week 3 was clean, reduce machine assistance slightly; otherwise repeat.':e.load==='kg'?'Use a small load increase ONLY if all Week 3 top-range reps were clean. Otherwise repeat your previous load.':'Resume full volume; increase leverage difficulty only if your Week 3 reps were excellent.';}
    else if(w===6){note='Use around 2 reps in reserve; compare quality and load with earlier weeks.';}
    else if(w===2){note='Aim for +1 clean rep compared with the previous week while maintaining form.';}
    else if(w===3){note='Aim for quality at a higher rep range; do not force a weight increase yet.';}
  }
  if(item.optional)note='Optional. Keep holds easy and stop before form fades. A walk or full rest is fine.';
  const range=(min===max?String(min):`${min}–${max}`);
  const descriptor=e.unit==='sec'?'sec':e.unit==='min'?'min':'reps';
  const text=e.mode==='review'?'1 × weekly review':specialSets?(item.special==='pushTest' ? '1× clean max + 2× 6–8 reps' : '1× strict max-form test'): `${sets} × ${range} ${descriptor}${['rev_lunge','bulgarian','thoracic_rot','ankle_mob','dead_bug'].includes(item.id)?'/side':''}`;
  const targets=e.mode==='review'?['Review']:specialSets||Array(sets).fill(range);
  return { ...item, exercise:e, sets, min, max, text, note, targets, isTest, optional:!!item.optional};
}
function sessionFor(weekIndex,dayIndex,archived=false){
  const day=(archived?PLAN.originalDays:PLAN.days)[dayIndex];
  let entries=day.items.slice();
  // Place push-up max-form testing near the start, before fatiguing rowing volume.
  if(day.key==='tue' && (weekIndex===5 || (archived && weekIndex===0))){
    const p=entries.findIndex(x=>x.id==='pushup');const [test]=entries.splice(p,1);
    entries.splice(entries.findIndex(x=>x.id==='strict_pull')+1,0,test);
  }
  return { ...day, week:weekIndex+1, dayIndex, date:dateKey(weekIndex,dayIndex,archived), dateObj:displayDate(weekIndex,dayIndex,archived), items:entries.map(entry=>specFor(entry,weekIndex,archived)) };
}
function formattedDate(d) {return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function allSessions(archived=false) {return PLAN.phases.flatMap((_,w)=>PLAN.days.map((_,d)=>sessionFor(w,d,archived)));}

  function tinyChart(values,label){

    const nums=pts.map(p=>p.y),low=Math.min(...nums)-.5,high=Math.max(...nums)+.5,range=high-low||1;

    const lines=pts.length>1?`<polyline points="${pts.map(pos).join(' ')}" fill="none" stroke="#bafa6c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:'';
    return `<svg class="microchart" viewBox="0 0 420 180" role="img" aria-label="${label} by training week"><line x1="24" y1="154" x2="405" y2="154" stroke="#3d4a3e"/>${[1,2,3,4,5,6].map(w=>`<text x="${24+(w-1)*71}" y="174" text-anchor="middle">W${w}</text>`).join('')}${lines}${pts.map(p=>`<circle cx="${p.x}" cy="${155-((p.y-low)/range)*112}" r="5" fill="#bafa6c"><title>${p.y}</title></circle>`).join('')}</svg>`;

        canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        const result=canvas.toDataURL('image/jpeg',quality);
        if(isPhoto(result))return result;
        edge*=.8;
      }
      throw Error('Could not compress photo');
    }finally{URL.revokeObjectURL(url);}
  }
  function persistUpdate(fields,message,render=renderView){
    if(!save({...db,...fields}))return false;
    if(render)keepScroll(render);
    if(message)toast(message);
    return true;
  }
  function updateRecord(collection,date,record,message,render){
    const updated={...db[collection]};
    if(Object.keys(record).length)updated[date]=record;
    else delete updated[date];
    return persistUpdate({[collection]:updated},message,render);
  }
  function changeWellnessDate(area,key){
    if(!Object.hasOwn(wellnessDates,area)||!validDay(key)||key<'1900-01-01'||key>'2200-01-01')return;
    wellnessDates[area]=key;
    keepScroll(renderView);
  }
  function wellnessClick(button){
    const {action,area,step,date,angle,index}=button.dataset;
    if(action==='wellness-date-step')return changeWellnessDate(area,offsetDay(wellnessDates[area],Number(step)));
    if(action==='meal-day')return changeWellnessDate('nutrition',date);
    if(action==='food-remove'){
      const date=wellnessDates.nutrition, daily=db.nutrition[date];
      return updateRecord('nutrition',date,{...daily,extras:daily.extras.filter((_,i)=>i!==Number(index))},'Food removed.');
    }
    if(action==='photo-remove' && confirm(`Remove the ${angle.toLowerCase()} photo for this date?`)){
      const date=wellnessDates.photos, photos={...db.photos[date]};
      delete photos[angle];
      return updateRecord('photos',date,photos,'Photo removed.');
    }
  }
  async function wellnessChange(input){
    const {action,area,slot,angle}=input.dataset;
    if(action==='wellness-date')return changeWellnessDate(area,input.value);
    if(action==='meal-check'||action==='meal-portion'){
      const date=wellnessDates.nutrition, daily=db.nutrition[date]||{};
      const value=action==='meal-check'?{done:input.checked}:{portion:Number(input.value)};
      const meals={...daily.meals,[slot]:{...daily.meals?.[slot],...value}};
      if(updateRecord('nutrition',date,{...daily,meals},'Meal log saved.')){
        document.querySelector(`[data-action="${action}"][data-slot="${slot}"]`)?.focus({preventScroll:true});
      }else if(action==='meal-check')input.checked=!!daily.meals?.[slot]?.done;
      else input.value=daily.meals?.[slot]?.portion||100;
      return;
    }
    if(action==='photo-add'){
      const file=input.files?.[0], date=wellnessDates.photos;
      if(!file||!photoAngles.includes(angle))return;
      if(file.size>25_000_000){input.value='';return toast('Choose an image smaller than 25 MB.');}
      input.disabled=true;
      try{
        const photo=await compressPhoto(file);
        const photos={...db.photos[date],[angle]:photo};
        updateRecord('photos',date,photos,'Photo saved.',activeView==='progress'&&wellnessDates.photos===date?renderProgress:null);
      }catch{
        toast('Could not open this image. Try a JPG, PNG or WebP file.');
      }finally{input.disabled=false;input.value='';}
    }
  }
  function handleSubmit(event){
    const form=event.target, kind=form.dataset.form;
    if(!kind)return;
    event.preventDefault();
    const values=formRecord(form);
    const date=wellnessDates.recovery;
    if(kind==='food'){
      const name=values.name.trim();
      if(!name||!NUTRIENTS.some(([key])=>values[key]!==''))return toast('Enter a food name and at least one nutrition value.');
      const date=wellnessDates.nutrition, daily=db.nutrition[date]||{};
      const extra=Object.fromEntries(NUTRIENTS.map(([key])=>[key,Number(values[key])||0]));
      return updateRecord('nutrition',date,{...daily,extras:[...(daily.extras||[]),{name,...extra}]},'Food logged.');
    }
    if(kind==='nutrition-target'){
      const target={...DEFAULT_TARGET,...db.nutritionTarget};
      for(const [key] of NUTRIENTS)if(values[key]!=='')target[key]=Number(values[key]);
      return persistUpdate({nutritionTarget:target},'Daily targets saved.');
    }
    if(kind==='recovery')return updateRecord('recovery',date,values,'Recovery log saved.');
    if(kind==='skin')return updateRecord('skin',date,{am:values.am==='on',pm:values.pm,response:values.response},'Skincare log saved.');
    if(kind==='skin-start'&&validDay(values.start)&&values.start>='1900-01-01'&&values.start<='2200-01-01')return persistUpdate({skinStart:values.start},'Skincare start date saved.');
  }

  document.addEventListener('submit',handleSubmit);
  document.addEventListener('click',handleClick);
  document.addEventListener('change',handleChange);
  document.addEventListener('input',handleInput);
  element('importFile').addEventListener('change',event=>{handleFile(event.target.files?.[0]);event.target.value='';});
  element('exerciseDialog').addEventListener('click',event=>{if(event.target===element('exerciseDialog'))element('exerciseDialog').close();});
  element('liveDate').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
  updateNav();showView('dashboard',false);
})();

</script>
</body>
</html>
